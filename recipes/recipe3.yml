---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# source: quay.io/pratyay360/sway:latest
name: sway
description: Blueee OS Sway - Fedora Sway Atomic with curated packages, Flatpaks, and tweaks.
base-image: quay.io/fedora-ostree-desktops/sway-atomic
image-version: 44
alt-tags:
  - "44"

modules:
  - from-file: rpmostree.yml
  - from-file: dnf.yml
  - from-file: script.yml
  - from-file: files.yml
  - from-file: font.yml
  - from-file: flatpak.yml
  - from-file: systemd.yml
  - from-file: os-release.yml

  - type: signing
