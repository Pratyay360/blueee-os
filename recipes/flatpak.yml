---
# yaml-language-server: $schema=https://schema.blue-build.org/module-v1.json
# image will be published to ghcr.io/pratyay360/blue-build
type: default-flatpaks
configurations:
  - notify: false
    scope: system
    repo:
      url: https://dl.flathub.org/repo/flathub.flatpakrepo
      name: flathub
      title: Flathub
    install:
      - org.gnome.Loupe
      - app.devsuite.Ptyxis
      - io.github.kolunmi.Bazaar
      - com.bitwarden.desktop
      - com.github.tchx84.Flatseal
      - io.github.flattool.Warehouse
      - io.podman_desktop.PodmanDesktop
      - io.github.sitraorg.sitra
      - com.collaboraoffice.Office
      - com.rustdesk.RustDesk
      - io.github.nozwock.Packet
      - it.mijorus.gearlever
      - org.gnome.DejaDup
  - notify: false
    scope: system
    repo:
      url: https://flatpak.orionbrowser.com/orion-beta.flatpakrepo
      name: orion-beta
      title: orion
    install:
      - com.kagi.Orion
