---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# source: quay.io/pratyay360/kinoite:latest
name: kinoite
description: Blueee OS Kinoite - Fedora KDE Plasma Atomic with curated packages, Flatpaks, and tweaks.
base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: 44

modules:
  - from-file: rpmostree.yml
  - from-file: dnf.yml
  - from-file: script.yml
  - from-file: files.yml
  - from-file: font.yml
  - from-file: flatpak.yml
  - from-file: systemd.yml
  - from-file: os-release.yml

  - type: signing
