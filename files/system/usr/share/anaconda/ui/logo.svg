<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="500" height="500" fill="#2d435e"/>

  <defs>
    <!-- Curved Path for BLUEEE text -->
    <path id="textArc" d="M 120,180 A 170,170 0 0,1 380,180" fill="none" />
  </defs>

  <!-- Top Text: BLUEEE -->
  <text fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="38" letter-spacing="3">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      BLUEEE
    </textPath>
  </text>

  <!-- Central Symbol Group -->
  <g transform="translate(250, 260)" stroke="#a3c7eb" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- Outer Arc Grid Lines (Globe grid overlay) -->
    <path d="M -60,-25 A 65,65 0 0,1 -60,25" />
    <path d="M 60,-25 A 65,65 0 0,0 60,25" />
    <path d="M -25,-60 A 65,65 0 0,1 25,-60" />
    <path d="M -25,60 A 65,65 0 0,0 25,60" />

    <!-- Outer Main Ring -->
    <circle cx="0" cy="0" r="60" />

    <!-- 8 Radial Spokes / Handles -->
    <!-- Up -->
    <line x1="0" y1="-60" x2="0" y2="-85" />
    <circle cx="0" cy="-93" r="8" fill="#2d435e" />

    <!-- Up-Right -->
    <line x1="42.4" y1="-42.4" x2="60.1" y2="-60.1" />
    <circle cx="65.8" cy="-65.8" r="8" fill="#2d435e" />

    <!-- Right -->
    <line x1="60" y1="0" x2="85" y2="0" />
    <circle cx="93" cy="0" r="8" fill="#2d435e" />

    <!-- Down-Right -->
    <line x1="42.4" y1="42.4" x2="60.1" y2="60.1" />
    <circle cx="65.8" cy="65.8" r="8" fill="#2d435e" />

    <!-- Down -->
    <line x1="0" y1="60" x2="0" y2="85" />
    <circle cx="0" cy="93" r="8" fill="#2d435e" />

    <!-- Down-Left -->
    <line x1="-42.4" y1="42.4" x2="-60.1" y2="60.1" />
    <circle cx="-65.8" cy="65.8" r="8" fill="#2d435e" />

    <!-- Left -->
    <line x1="-60" y1="0" x2="-85" y2="0" />
    <circle cx="-93" cy="0" r="8" fill="#2d435e" />

    <!-- Up-Left -->
    <line x1="-42.4" y1="-42.4" x2="-60.1" y2="-60.1" />
    <circle cx="-65.8" cy="-65.8" r="8" fill="#2d435e" />

    <!-- Inner Spokes (from Center Ring to Main Ring) -->
    <line x1="0" y1="-12" x2="0" y2="-60" />
    <line x1="8.5" y1="-8.5" x2="42.4" y2="-42.4" />
    <line x1="12" y1="0" x2="60" y2="0" />
    <line x1="8.5" y1="8.5" x2="42.4" y2="42.4" />
    <line x1="0" y1="12" x2="0" y2="60" />
    <line x1="-8.5" y1="8.5" x2="-42.4" y2="42.4" />
    <line x1="-12" y1="0" x2="-60" y2="0" />
    <line x1="-8.5" y1="-8.5" x2="-42.4" y2="-42.4" />

    <!-- Center Ring -->
    <circle cx="0" cy="0" r="12" fill="#2d435e" />
  </g>

  <!-- Left Four-Point Star -->
  <path d="M 80,277 Q 80,265 68,265 Q 80,265 80,253 Q 80,265 92,265 Q 80,265 80,277 Z" fill="#a3c7eb" />

  <!-- Right Four-Point Star -->
  <path d="M 420,277 Q 420,265 408,265 Q 420,265 420,253 Q 420,265 432,265 Q 420,265 420,277 Z" fill="#a3c7eb" />

  <!-- Bottom Text: OS -->
  <text x="250" y="420" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="bold" letter-spacing="4">
    OS
  </text>
</svg>
