name: Build ISO and Upload
on:
  workflow_run:
    workflows: ["bluebuild"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: iso-build-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  iso:
    name: Build ISO
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        images:
          - quay.io/pratyay360/catchy-kinoite:latest
          - quay.io/pratyay360/catchy-silverblue:latest
          - quay.io/pratyay360/catchy-sway:latest
          - ghcr.io/pratyay360/catchy-cosmic:latest
          - ghcr.io/pratyay360/sway:latest
          - quay.io/pratyay360/kinoite:latest
          - quay.io/pratyay360/silverblue:latest
          - ghcr.io/pratyay360/cosmic:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git cargo gcc \
            podman \
            qemu-system buildah \
            libssl-dev

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          version: 2024.10.21

      - name: Verify BlueBuild
        run: mise run verify

      - name: Extract image name
        id: recipe
        run: |
          IMAGE="${{ matrix.images }}"
          BASENAME="${IMAGE##*/}"
          NAME="${BASENAME%:*}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Generate ISO from published image
        id: generate-iso
        env:
          IMAGE: ${{ matrix.images }}
          NAME: ${{ steps.recipe.outputs.name }}
        run: |
          mise run generate-iso
          echo "iso-output-path=output/${NAME}.iso" >> "$GITHUB_OUTPUT"
          echo "=== Verify ISO output (workflow) ==="
          ls -lh "output/${NAME}.iso" || true
          find output -type f -ls || true
          if [ ! -f "output/${NAME}.iso" ]; then
            echo "::error::ISO not found at output/${NAME}.iso after mise task"
            find . -maxdepth 5 -type f -name "*.iso" -ls 2>/dev/null || true
            exit 1
          fi

      - name: Upload ISO to GoFile
        id: gofile
        env:
          FILE: ${{ steps.generate-iso.outputs.iso-output-path }}
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
          NAME: ${{ steps.recipe.outputs.name }}
        run: mise run upload

      - name: View URL and QR Code
        run: |
          echo "Image:      ${{ matrix.images }}"
          echo "GoFile URL: ${{ steps.gofile.outputs.url }}"
          echo "GoFile QR:  ${{ steps.gofile.outputs.qrcode }}"
