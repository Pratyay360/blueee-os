name: Build ISO and Upload
on:
  workflow_run:
    workflows: ["bluebuild"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: iso-build-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  iso:
    name: Build ISO
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        images:
          - quay.io/pratyay360/catchy-kinoite:latest
          - quay.io/pratyay360/catchy-silverblue:latest
          - quay.io/pratyay360/catchy-sway:latest
          - ghcr.io/pratyay360/catchy-cosmic:latest
          - ghcr.io/pratyay360/sway:latest
          - quay.io/pratyay360/kinoite:latest
          - quay.io/pratyay360/silverblue:latest
          - ghcr.io/pratyay360/cosmic:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git cargo gcc \
            podman \
            qemu-system buildah gcc \
            libssl-dev \

      - name: Install BlueBuild CLI
        run: |
          cargo install --locked blue-build
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify BlueBuild
        run: bluebuild --version

      - name: Extract image name
        id:
        run: |
          NAME="${{ matrix.recipe }}"
          echo "name=${NAME%.yml}" >> "$GITHUB_OUTPUT"

      - name: Generate ISO from published image
        id: generate-iso
        run: |
          NAME="${{ steps.recipe.outputs.name }}"
          mkdir -p output
          bluebuild generate-iso \
            --iso-name "${NAME}.iso" \
            --output-dir ./output \
            image "${{ matrix.images }}"
          echo "iso-output-path=output/${NAME}.iso" >> "$GITHUB_OUTPUT"

      - name: Upload ISO to GoFile
        id: gofile
        uses: ahnafnafee/action-upload-gofile@main
        with:
          token: ${{ secrets.GOFILE_TOKEN }}
          file: ${{ steps.generate-iso.outputs.iso-output-path }}

      - name: View URL and QR Code
        run: |
          echo "Recipe:     ${{ matrix.images }}"
          echo "GoFile URL: ${{ steps.gofile.outputs.url }}"
          echo "GoFile QR:  ${{ steps.gofile.outputs.qrcode }}"
